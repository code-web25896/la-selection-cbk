<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Découvrez les collections et produits de La Sélection CBK.">
  <title>Collection | La Sélection CBK</title>
  <style>
    :root{--ink:#171717;--muted:#6b6862;--line:#ded8d0;--paper:#f6f3ed;--blue:#173d75;--shadow:0 18px 60px rgba(20,20,20,.1)}
    *{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}main{max-width:1380px;margin:0 auto;padding:0 28px 80px}
    .intro{position:relative;isolation:isolate;margin:0 -28px 38px;padding:54px 28px 42px;background:var(--paper);border-bottom:1px solid var(--line)}.intro:before{content:"";position:absolute;z-index:-1;inset:0 calc((1380px - 100vw)/2)}.intro-inner{max-width:1380px;margin:auto}.crumb{font-size:11px;color:var(--muted);margin-bottom:25px}.crumb a{text-decoration:none}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--blue)}
    h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.025em}h1{font-size:clamp(48px,6vw,64px);line-height:.96;margin:13px 0 15px}.intro p{max-width:740px;color:var(--muted);line-height:1.7;margin:0}.collection-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.collection-meta span{background:#fff;padding:7px 12px;font-size:12px}
    .section-title{font-size:36px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);padding:20px;transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.card img{display:block;width:100%;height:230px;object-fit:cover;margin-bottom:16px;background:var(--paper)}.brand{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.card h2{font-size:25px;margin:7px 0}.card p{color:var(--muted);font-size:13px;margin:4px 0}.specs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.spec{background:var(--paper);padding:5px 8px;font-size:11px}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}.button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 13px;background:#171717;color:#fff;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.reserve{width:40px;height:40px;border:0;background:var(--blue);color:#fff;font-size:18px;cursor:pointer}.empty{padding:22px;border:1px solid var(--line);color:var(--muted)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){main{padding:0 18px 60px}.intro{margin:0 -18px 30px;padding:40px 18px 32px}.grid{grid-template-columns:1fr}.section-title{font-size:31px}}
  </style>
</head>
<body>
  <header></header>
  <main>
    <section class="intro"><div class="intro-inner">
      <div class="crumb"><a href="/index.html">Accueil</a> / <a href="/index.html#collections">Collections</a> / <span id="collectionCrumb">Collection</span></div>
      <div class="kicker" id="collectionBrand">La Sélection CBK</div><h1 id="collectionTitle">Collection</h1>
      <p id="collectionDescription">Découvrez les produits et finitions de cette collection.</p>
      <div class="collection-meta" id="collectionSpecs"></div>
    </div></section>
    <section aria-labelledby="productsTitle">
      <h2 class="section-title" id="productsTitle">Les produits de la collection</h2>
      <p class="lead">Retrouvez les références associées à cette collection.</p>
      <div class="grid" id="collectionProducts" aria-live="polite"></div>
      <p class="empty" id="collectionEmpty" hidden>Aucun produit n’est encore associé à cette collection.</p>
    </section>
  </main>
  <script>
    (() => {
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) return;
      const safe = (value) => String(value || '');
      const grid = document.getElementById('collectionProducts');
      const makeProduct = (entry) => {
        const card = document.createElement('article'); card.className = 'card';
        if (entry.image) { const image=document.createElement('img'); image.src=entry.image; image.alt=entry.name; card.appendChild(image); }
        const brand=document.createElement('div'); brand.className='brand'; brand.textContent=entry.brand;
        const title=document.createElement('h2'); title.textContent=entry.name;
        const description=document.createElement('p'); description.textContent=entry.description || entry.effect || '';
        const specs=document.createElement('div'); specs.className='specs';
        [entry.format,entry.finish].filter(Boolean).forEach((value)=>{const chip=document.createElement('span');chip.className='spec';chip.textContent=value;specs.appendChild(chip)});
        if (entry.price != null || entry.stock != null) { const commerce=document.createElement('p'); commerce.textContent=`${entry.price != null ? `${entry.price} TND` : ''}${entry.price != null && entry.stock != null ? ' · ' : ''}${entry.stock != null ? `Stock : ${entry.stock}` : ''}`; card.append(brand,title,description,specs,commerce); }
        else card.append(brand,title,description,specs);
        const actions=document.createElement('div'); actions.className='actions';
        const link=document.createElement('a'); link.className='button'; link.href=entry.link || `/catalogue-${String(entry.universe||'carrelage').toLowerCase()}.html?q=${encodeURIComponent(entry.name)}`; link.textContent='Voir le produit';
        const add=document.createElement('button'); add.className='reserve'; add.type='button'; add.textContent='＋'; add.setAttribute('aria-label',`Ajouter ${entry.name} au panier`);
        add.dataset.productName=safe(entry.name); add.dataset.productBrand=safe(entry.brand); add.dataset.productVariant=[entry.format,entry.finish].filter(Boolean).join(' · '); add.dataset.productImage=safe(entry.image);
        actions.append(link,add); card.appendChild(actions); return card;
      };
      Promise.all([
        fetch(`/api/catalogue/entries?kind=collection`).then((response)=>response.ok?response.json():null),
        fetch(`/api/catalogue/entries?kind=product&collectionSlug=${encodeURIComponent(slug)}`).then((response)=>response.ok?response.json():null),
      ]).then(([collections,products])=>{
        const collection=collections?.entries?.find((entry)=>entry.slug===slug);
        if(!collection){document.getElementById('collectionTitle').textContent='Collection introuvable';document.getElementById('collectionDescription').textContent='Cette collection n’est pas disponible.';return}
        document.title=`${collection.name} | La Sélection CBK`;
        document.getElementById('collectionCrumb').textContent=collection.name;
        document.getElementById('collectionBrand').textContent=collection.brand || 'La Sélection CBK';
        document.getElementById('collectionTitle').textContent=collection.name;
        document.getElementById('collectionDescription').textContent=collection.description || 'Découvrez les produits et finitions de cette collection.';
        document.getElementById('collectionSpecs').replaceChildren(...[collection.format,collection.finish,collection.effect].filter(Boolean).map((value)=>{const chip=document.createElement('span');chip.textContent=value;return chip}));
        const entries=products?.entries || [];
        grid.replaceChildren(...entries.map(makeProduct));
        document.getElementById('collectionEmpty').hidden=entries.length>0;
      }).catch(()=>{document.getElementById('collectionEmpty').hidden=false});
    })();
  </script>
</body>
</html>
