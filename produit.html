<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fiche produit La Sélection CBK.">
  <title>Fiche produit | La Sélection CBK</title>
  <style>
    :root{--ink:#171717;--muted:#6b6862;--line:#ded8d0;--paper:#f6f3ed;--blue:#173d75;--shadow:0 18px 60px rgba(20,20,20,.08)}
    *{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}main{max-width:1380px;margin:0 auto;padding:28px 28px 80px}.crumb{color:var(--muted);font-size:11px;margin:0 0 22px}.crumb a{text-decoration:none}.product{display:grid;grid-template-columns:1.15fr .85fr;gap:7%;align-items:start}.visual{min-height:560px;background:var(--paper);position:relative}.visual img{width:100%;height:100%;min-height:560px;object-fit:cover;position:absolute;inset:0}.details{padding:20px 0}.brand{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.025em}h1{font-size:clamp(48px,6vw,72px);line-height:.98;margin:12px 0}.subtitle{font-size:21px;color:var(--muted);margin:0 0 28px}.specs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 26px}.spec{background:var(--paper);padding:8px 12px;font-size:12px}.description{color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:22px}.commerce{font-size:15px;font-weight:700;margin:20px 0;color:var(--blue)}.actions{display:flex;align-items:center;gap:12px;margin-top:28px}.reserve{min-height:50px;padding:0 22px;border:0;background:var(--blue);color:#fff;font:700 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.heart{width:50px;height:50px;border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer}.back{display:inline-block;margin-top:26px;color:var(--blue);font-weight:700;text-decoration:none;font-size:12px}.missing{padding:80px 0;color:var(--muted)}
    @media(max-width:800px){main{padding:20px 18px 60px}.product{grid-template-columns:1fr;gap:16px}.visual,.visual img{min-height:360px}.details{padding:10px 0}.subtitle{font-size:18px}}
  </style>
</head>
<body>
  <header></header>
  <main>
    <div class="crumb"><a href="/index.html">Accueil</a> / <a href="/catalogue-carrelage.html">Catalogue</a> / <span id="productCrumb">Fiche produit</span></div>
    <section class="product" id="productSheet" hidden>
      <div class="visual"><img id="productImage" src="" alt=""></div>
      <div class="details">
        <div class="brand" id="productBrand"></div><h1 id="productName"></h1>
        <p class="subtitle" id="productSubtitle"></p>
        <div class="specs" id="productSpecs"></div>
        <p class="description" id="productDescription"></p>
        <p class="commerce" id="productCommerce" hidden></p>
        <div class="actions">
          <button class="reserve" id="addProduct" type="button">Ajouter au panier</button>
          <button class="heart" id="favoriteProduct" type="button" aria-label="Ajouter aux favoris">♡</button>
        </div>
        <a class="back" id="collectionBack" href="/catalogue-carrelage.html">← Retour au catalogue</a>
      </div>
    </section>
    <p class="missing" id="productMissing" hidden>Cette fiche produit n’est pas disponible.</p>
  </main>
</body>
</html>
